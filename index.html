<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>⚡ Painel Elétrico</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body{background:#0d1117;color:#fff;font-family:sans-serif;padding:20px}
        .chart-container{height:300px;background:#161b22;padding:20px;border-radius:10px;margin-bottom:20px}
    </style>
</head>
<body>
    <h1>Monitor de Telemetria</h1>
    <div id="debug" style="color:yellow">Aguardando conexão...</div>
    <div class="chart-container"><canvas id="tensaoChart"></canvas></div>
    <div class="chart-container"><canvas id="correnteChart"></canvas></div>

<script>
    const SUPABASE_URL = 'https://clsppqtiwelfoefsqyra.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNsc3BwcXRpd2VsZm9lZnNxeXJhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIxNjgyMjYsImV4cCI6MjA5Nzc0NDIyNn0.8Ox3b_pPYg3CPcy7yRhmPhta905UIUfznVGxo_ZQzhg';
    const TABLE_NAME = 'telemetria_eletrica';

    const ctxTensao = document.getElementById('tensaoChart').getContext('2d');
    const chartTensao = new Chart(ctxTensao, { type: 'line', data: { labels: [], datasets: [{label:'V_A', data:[], borderColor:'red'}, {label:'V_B', data:[], borderColor:'green'}, {label:'V_C', data:[], borderColor:'blue'}]}, options:{responsive:true, maintainAspectRatio:false}});
    
    const ctxCorrente = document.getElementById('correnteChart').getContext('2d');
    const chartCorrente = new Chart(ctxCorrente, { type: 'line', data: { labels: [], datasets: [{label:'I_A', data:[], borderColor:'red'}, {label:'I_B', data:[], borderColor:'green'}, {label:'I_C', data:[], borderColor:'blue'}]}, options:{responsive:true, maintainAspectRatio:false}});

    async function carregarDados() {
        try {
            const url = `${SUPABASE_URL}/rest/v1/${TABLE_NAME}?select=*&limit=36&order=timestamp.desc`;
            const response = await fetch(url, {
                headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
            });
            const data = await response.json();

            if (!data || data.length === 0) {
                document.getElementById('debug').textContent = "Erro: Nenhum dado retornado do banco.";
                return;
            }

            // DEBUG: Isso vai mostrar no console do navegador (F12) o nome EXATO das colunas
            console.log("DADOS DO BANCO:", data[0]);
            document.getElementById('debug').textContent = "Dados recebidos! Verifique o console (F12) para ver os nomes das colunas.";

            const historico = data.reverse();
            
            // Limpa arrays
            chartTensao.data.labels = []; chartCorrente.data.labels = [];
            chartTensao.data.datasets.forEach(ds => ds.data = []);
            chartCorrente.data.datasets.forEach(ds => ds.data = []);

            historico.forEach(item => {
                // Tenta pegar o valor, ignorando se está em maiúsculo ou minúsculo
                // Se o seu banco tem colunas como 'tensao_a', 'Tensao_A', 'TENSAO_A', isso deve funcionar
                const getVal = (key) => item[key] || item[key.toLowerCase()] || item[key.toUpperCase()] || 0;

                const label = item.timestamp ? new Date(item.timestamp).toLocaleTimeString() : "-";
                
                chartTensao.data.labels.push(label);
                chartTensao.data.datasets[0].data.push(getVal('tensao_a'));
                chartTensao.data.datasets[1].data.push(getVal('tensao_b'));
                chartTensao.data.datasets[2].data.push(getVal('tensao_c'));

                chartCorrente.data.labels.push(label);
                chartCorrente.data.datasets[0].data.push(getVal('corrente_a'));
                chartCorrente.data.datasets[1].data.push(getVal('corrente_b'));
                chartCorrente.data.datasets[2].data.push(getVal('corrente_c'));
            });

            chartTensao.update();
            chartCorrente.update();

        } catch (error) {
            console.error("Erro:", error);
            document.getElementById('debug').textContent = "Erro ao conectar: " + error.message;
        }
    }

    carregarDados();
    setInterval(carregarDados, 300000); // Atualiza a cada 5 min
</script>
</body>
</html>
