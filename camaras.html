<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>❄️ Monitor Câmaras - Brasileira Distribuidora</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Segoe UI',sans-serif;background:#0d1117;color:#e6edf3;min-height:100vh}
    
    header{background:#161b22;padding:15px 30px;border-bottom:1px solid #30363d;}
    main{padding:20px;max-width:1400px;margin:0 auto}
    
    .secao {margin-bottom:30px; padding:20px; background:#161b22; border-radius:15px; border:1px solid #30363d;}
    .secao-titulo {margin-bottom:20px; color:#58a6ff; border-left:4px solid #58a6ff; padding-left:10px;}

    .camaras-grid {display:grid; grid-template-columns:repeat(auto-fit, minmax(350px, 1fr)); gap:20px;}
    .ccard {background:#0d1117; border:1px solid #30363d; border-radius:10px; padding:15px;}
    
    .chart-container {height: 150px; margin: 10px 0;}
    .alarmes-box {font-size:0.75rem; background:#161b22; padding:10px; border-radius:5px; margin-top:10px;}
    .alerta-item {color:#f0883e; margin-bottom:2px;}
    
    .status-badge {font-size:0.7rem; padding:2px 8px; border-radius:10px; background:#21262d;}
</style>
</head>
<body>

<header>
    <div style="display:flex; align-items:center; gap: 15px;">
        <img src="logo.png" alt="Logo Empresa" style="height: 50px;">
        <h1>Monitor de Câmaras Frias - Brasileira Distribuidora de Frutas</h1>
    </div>
</header>

<main>
    <div class="secao">
        <h2 class="secao-titulo">Barracão</h2>
        <div class="camaras-grid" id="grid-barracao">
            </div>
    </div>

    <div class="secao">
        <h2 class="secao-titulo">Câmara Ponto de Venda</h2>
        <div class="camaras-grid" id="grid-pdv">
            </div>
    </div>
</main>

<script>
const API_URL = '/api/camaras';
const configs = [
    {id: '1', nome: 'Câmara Barracão 01', grupo: 'grid-barracao'},
    {id: '2', nome: 'Câmara Barracão 02', grupo: 'grid-barracao'},
    {id: '3', nome: 'Câmara Barracão 03', grupo: 'grid-barracao'},
    {id: '4', nome: 'Câmara PDV', grupo: 'grid-pdv'}
];

const charts = {};

// Montar cards
configs.forEach(c => {
    document.getElementById(c.grupo).innerHTML += `
        <div class="ccard">
            <div style="display:flex; justify-content:space-between"><b>${c.nome}</b> <span id="st${c.id}">--</span></div>
            <div style="font-size:2rem; font-weight:bold" id="t${c.id}">--°C</div>
            <div class="chart-container"><canvas id="chart${c.id}"></canvas></div>
            <div class="alarmes-box">
                <div style="color:#8b949e">Últimos Eventos:</div>
                <div id="ev${c.id}">Nenhum evento.</div>
            </div>
        </div>
    `;
    // Inicializa Gráficos com linhas de limite
    const ctx = document.getElementById('chart'+c.id).getContext('2d');
    charts[c.id] = new Chart(ctx, {
        type: 'line',
        data: { labels: [], datasets: [
            {label: 'Temp', data: [], borderColor: '#58a6ff', fill: false},
            {label: 'Limite Baixo (<5)', data: [], borderColor: '#00008b', borderDash: [5,5], pointRadius: 0},
            {label: 'Limite Alto (>15)', data: [], borderColor: '#8b4513', borderDash: [5,5], pointRadius: 0}
        ]},
        options: { responsive: true, maintainAspectRatio: false, plugins: {legend: {display:false}} }
    });
});

function registrarEvento(id, msg) {
    const el = document.getElementById('ev' + id);
    let logs = el.innerHTML.split('<br>').filter(Boolean);
    logs.unshift(`[${new Date().toLocaleTimeString()}] ${msg}`);
    if(logs.length > 5) logs.pop();
    el.innerHTML = logs.join('<br>');
}

async function atualizar() {
    configs.forEach(c => {
        // Simulação de temperatura entre 2 e 18 graus
        const temp = 2 + (Math.random() * 16);
        const chart = charts[c.id];
        
        document.getElementById('t'+c.id).textContent = temp.toFixed(1) + '°C';
        
        // Atualiza Gráfico
        chart.data.labels.push(new Date().toLocaleTimeString());
        chart.data.datasets[0].data.push(temp);
        chart.data.datasets[1].data.push(5);  // Limite baixo
        chart.data.datasets[2].data.push(15); // Limite alto
        
        if(chart.data.labels.length > 20) {
            chart.data.labels.shift();
            chart.data.datasets.forEach(d => d.data.shift());
        }
        chart.update();

        // Lógica de Alarmes
        if(temp < 5) {
            registrarEvento(c.id, "ALERTA: Temp Baixa!");
        } else if(temp > 15) {
            registrarEvento(c.id, "ALERTA: Temp Alta!");
        }
    });
}

setInterval(atualizar, 5000);
atualizar();
</script>
</body>
</html>
