<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>❄️ Monitor Câmaras - Brasileira Distribuidora</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Segoe UI',sans-serif;background:#0d1117;color:#e6edf3;min-height:100vh}
    
    header{background:#161b22;padding:15px 30px;border-bottom:1px solid #30363d;}
    main{padding:20px;max-width:1400px;margin:0 auto}
    
    .secao {margin-bottom:30px; padding:20px; background:#161b22; border-radius:15px; border:1px solid #30363d;}
    .secao-titulo {margin-bottom:20px; color:#58a6ff; border-left:4px solid #58a6ff; padding-left:10px;}

    /* GRID ALINHADO: Garante que todos os cards tenham o mesmo tamanho */
    .camaras-grid {display:grid; grid-template-columns:repeat(2, 1fr); gap:20px;}
    .ccard {background:#0d1117; border:1px solid #30363d; border-radius:10px; padding:15px; display:flex; flex-direction:column;}
    
    .chart-container {flex-grow: 1; height: 150px; margin: 10px 0;}
    .alarmes-box {font-size:0.75rem; background:#161b22; padding:10px; border-radius:5px; margin-top:10px;}
    
    /* Destaque para limites */
    .limites-info {display:flex; justify-content:space-between; font-size:0.7rem; margin-top:5px; padding:5px; background:#0d1117;}
    .lim-baixo {color:#58a6ff; font-weight:bold;}
    .lim-alto {color:#e3893a; font-weight:bold;}
</style>
</head>
<body>

<header>
    <div style="display:flex; align-items:center; gap: 15px;">
        <img src="logo.png" alt="Logo Empresa" style="height: 50px;">
        <h1>Monitor de Câmaras Frias - Brasileira Distribuidora</h1>
    </div>
</header>

<main>
    <div class="secao">
        <h2 class="secao-titulo">Monitoramento Geral</h2>
        <div class="camaras-grid" id="grid-principal">
            </div>
    </div>
</main>

<script>
const configs = [
    {id: '1', nome: 'Câmara Barracão 01', mostrarLimites: false},
    {id: '2', nome: 'Câmara Barracão 02', mostrarLimites: false},
    {id: '3', nome: 'Câmara Barracão 03', mostrarLimites: true},
    {id: '4', nome: 'Câmara PDV', mostrarLimites: true}
];

const charts = {};

configs.forEach(c => {
    document.getElementById('grid-principal').innerHTML += `
        <div class="ccard">
            <div style="display:flex; justify-content:space-between"><b>${c.nome}</b></div>
            <div style="font-size:2rem; font-weight:bold" id="t${c.id}">--°C</div>
            <div class="chart-container"><canvas id="chart${c.id}"></canvas></div>
            ${c.mostrarLimites ? `<div class="limites-info">
                <span class="lim-baixo">Min: 5°C</span>
                <span class="lim-alto">Max: 15°C</span>
            </div>` : ''}
            <div class="alarmes-box">
                <div style="color:#8b949e">Últimos Eventos:</div>
                <div id="ev${c.id}">Aguardando...</div>
            </div>
        </div>
    `;

    const ctx = document.getElementById('chart'+c.id).getContext('2d');
    const datasets = [{label: 'Temp', data: [], borderColor: '#58a6ff', fill: false}];
    
    if(c.mostrarLimites) {
        datasets.push({label: 'Min', data: [], borderColor: '#58a6ff', borderDash: [5,5], pointRadius: 0});
        datasets.push({label: 'Max', data: [], borderColor: '#e3893a', borderDash: [5,5], pointRadius: 0});
    }

    charts[c.id] = new Chart(ctx, {
        type: 'line',
        data: { labels: [], datasets: datasets },
        options: { responsive: true, maintainAspectRatio: false, plugins: {legend: {display:false}} }
    });
});

function registrarEvento(id, msg) {
    const el = document.getElementById('ev' + id);
    let logs = el.innerHTML.includes('Aguardando') ? [] : el.innerHTML.split('<br>');
    logs.unshift(`[${new Date().toLocaleTimeString()}] ${msg}`);
    if(logs.length > 5) logs.pop();
    el.innerHTML = logs.join('<br>');
}

function atualizar() {
    configs.forEach(c => {
        const temp = 2 + (Math.random() * 16);
        const chart = charts[c.id];
        
        document.getElementById('t'+c.id).textContent = temp.toFixed(1) + '°C';
        
        chart.data.labels.push(new Date().toLocaleTimeString());
        chart.data.datasets[0].data.push(temp);
        if(c.mostrarLimites) {
            chart.data.datasets[1].data.push(5);
            chart.data.datasets[2].data.push(15);
        }
        
        if(chart.data.labels.length > 20) {
            chart.data.labels.shift();
            chart.data.datasets.forEach(d => d.data.shift());
        }
        chart.update();

        if(temp < 5) registrarEvento(c.id, "ALERTA: Temp Baixa!");
        else if(temp > 15) registrarEvento(c.id, "ALERTA: Temp Alta!");
    });
}

setInterval(atualizar, 5000);
atualizar();
</script>
</body>
</html>
