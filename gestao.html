<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão Energética - Painel Executivo</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .card-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 20px; }
        .label { color: #8b949e; font-size: 0.75rem; text-transform: uppercase; font-weight: bold; }
        .value { font-size: 1.8rem; font-weight: bold; margin-top: 8px; }
        .positivo { color: #3fb950; }
        .negativo { color: #f85149; }
        .neutro { color: #58a6ff; }
        input[type="month"] { background: #0d1117; color: #e6edf3; border: 1px solid #30363d; padding: 8px; border-radius: 5px; color-scheme: dark; }
    </style>
</head>
<body class="dark-theme" style="background-color: #0d1117; color: #e6edf3; font-family: sans-serif; margin: 0; padding: 0;">
    <header style="display: flex; justify-content: space-between; align-items: center; padding: 20px; border-bottom: 1px solid #30363d; background: #161b22;">
        <div>
            <h1 style="color: #58a6ff; font-size: 1.25rem; margin: 0;">📊 Gestão Energética Avançada</h1>
        </div>
        <div style="display: flex; gap: 15px; align-items: center;">
            <input type="month" id="mesFiltro" title="Filtrar por Mês">
            <a href="index.html" class="btn-voltar" style="background: #21262d; color: #c9d1d9; padding: 8px 16px; border: 1px solid #30363d; border-radius: 6px; text-decoration: none; font-size: 0.9rem;">⬅ Voltar</a>
        </div>
    </header>

    <main style="max-width: 1400px; margin: 20px auto; padding: 0 20px;">
        
        <h2 style="font-size: 1rem; color: #8b949e; margin-bottom: 15px; border-bottom: 1px solid #30363d; padding-bottom: 5px;">RESUMO DO PERÍODO SELECIONADO</h2>
        <section class="card-grid">
            <div class="card">
                <div class="label">Geração Solar Total</div>
                <div id="val-geracao" class="value positivo">0 kWh</div>
            </div>
            <div class="card">
                <div class="label">Consumo de Energia Total</div>
                <div id="val-consumo" class="value negativo">0 kWh</div>
            </div>
            <div class="card">
                <div class="label">Balanço (Injetado - Consumido)</div>
                <div id="val-saldo" class="value neutro">0 kWh</div>
            </div>
            <div class="card">
                <div class="label">Economia Gerada (R$)</div>
                <div id="val-economia" class="value positivo">R$ 0,00</div>
            </div>
        </section>

        <h2 style="font-size: 1rem; color: #8b949e; margin-top: 30px; margin-bottom: 15px; border-bottom: 1px solid #30363d; padding-bottom: 5px;">ANÁLISE ANUAL (MENSAL)</h2>
        <section class="card-grid" style="grid-template-columns: 1fr;">
            <div class="card">
                <canvas id="graficoAnual" style="max-height: 350px;"></canvas>
            </div>
        </section>

        <h2 style="font-size: 1rem; color: #8b949e; margin-top: 30px; margin-bottom: 15px; border-bottom: 1px solid #30363d; padding-bottom: 5px;">DETALHAMENTO DIÁRIO</h2>
        <section class="card-grid" style="grid-template-columns: 1fr 1fr;">
            <div class="card">
                <div class="label" style="margin-bottom: 15px;">Geração x Consumo (Diário)</div>
                <canvas id="graficoDiario" style="max-height: 300px;"></canvas>
            </div>
            <div class="card">
                <div class="label" style="margin-bottom: 15px;">Balanço Energético (Diário)</div>
                <canvas id="graficoSaldo" style="max-height: 300px;"></canvas>
            </div>
        </section>
    </main>
    <script src="gestao.js"></script>
</body>
</html>
