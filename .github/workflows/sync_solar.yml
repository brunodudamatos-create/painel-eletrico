# ── Credenciais (somente via variáveis de ambiente) ────────────
def get_env(name: str) -> str:
    val = os.environ.get(name)
    if not val:
        print(f"ERRO: variável de ambiente '{name}' não definida.")
        sys.exit(1)
    return val

